<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#1b2430" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#newsBg)" />

  <!-- Newspaper Header Layout -->
  <rect x="50" y="40" width="700" height="60" fill="#1f2937" rx="6" />
  <rect x="70" y="55" width="120" height="30" fill="#ffe600" rx="3" />
  <text x="130" y="75" font-family="'Montserrat', sans-serif" font-weight="900" font-size="14" fill="#111111" text-anchor="middle">LIVE NEWS</text>
  
  <text x="210" y="76" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#f3f4f6">MERN STACK NEWS APPLICATION</text>
  <rect x="630" y="55" width="100" height="30" fill="#374151" rx="3" />
  <text x="680" y="75" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#e5e7eb" text-anchor="middle">JWT AUTH</text>

  <!-- Left Main Story Mockup -->
  <g transform="translate(50, 120)">
    <rect width="420" height="340" fill="#1f2937" rx="8" stroke="#374151" stroke-width="1" />
    <rect x="20" y="20" width="380" height="170" fill="#111827" rx="6" />
    <!-- Headline Bars -->
    <rect x="20" y="210" width="280" height="18" fill="#ffffff" rx="3" />
    <rect x="20" y="240" width="360" height="12" fill="#9ca3af" rx="2" />
    <rect x="20" y="260" width="320" height="12" fill="#9ca3af" rx="2" />
    <rect x="20" y="295" width="100" height="24" fill="#ffe600" rx="4" />
    <text x="70" y="311" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="middle">READ MORE</text>
  </g>

  <!-- Right Sidebar Headlines -->
  <g transform="translate(490, 120)">
    <rect width="260" height="100" fill="#1f2937" rx="8" stroke="#374151" stroke-width="1" />
    <rect x="15" y="15" width="80" height="16" fill="#ffe600" rx="2" />
    <text x="55" y="27" font-family="'Montserrat', sans-serif" font-weight="800" font-size="9" fill="#111111" text-anchor="middle">TECH NEWS</text>
    <rect x="15" y="45" width="230" height="12" fill="#e5e7eb" rx="2" />
    <rect x="15" y="65" width="180" height="10" fill="#9ca3af" rx="2" />

    <rect y="120" width="260" height="100" fill="#1f2937" rx="8" stroke="#374151" stroke-width="1" />
    <rect x="15" y="135" width="80" height="16" fill="#60a5fa" rx="2" />
    <text x="55" y="147" font-family="'Montserrat', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">INDIA TODAY</text>
    <rect x="15" y="165" width="230" height="12" fill="#e5e7eb" rx="2" />
    <rect x="15" y="185" width="160" height="10" fill="#9ca3af" rx="2" />

    <rect y="240" width="260" height="100" fill="#1f2937" rx="8" stroke="#374151" stroke-width="1" />
    <rect x="15" y="255" width="90" height="16" fill="#34d399" rx="2" />
    <text x="60" y="267" font-family="'Montserrat', sans-serif" font-weight="800" font-size="9" fill="#111111" text-anchor="middle">WATCH LATER</text>
    <rect x="15" y="285" width="230" height="12" fill="#e5e7eb" rx="2" />
    <rect x="15" y="305" width="190" height="10" fill="#9ca3af" rx="2" />
  </g>
</svg>
