<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#dbBg)" />

  <!-- Top Title -->
  <g transform="translate(50, 40)">
    <rect width="700" height="50" fill="#1c2541" rx="6" stroke="#3a506b" stroke-width="1" />
    <rect x="20" y="10" width="130" height="30" fill="#ffe600" rx="4" />
    <text x="85" y="30" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="#111111" text-anchor="middle">RELATIONAL DB</text>
    <text x="175" y="32" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#ffffff">COURSE REGISTRATION MANAGEMENT SYSTEM</text>
    <text x="640" y="31" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#6fffe9">3NF / SQL</text>
  </g>

  <!-- Table 1: Students -->
  <g transform="translate(60, 120)">
    <rect width="200" height="150" fill="#0b132b" rx="6" stroke="#48cae4" stroke-width="1.5" />
    <rect width="200" height="30" fill="#48cae4" rx="5" />
    <text x="100" y="20" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#03045e" text-anchor="middle">tbl_students</text>
    <text x="15" y="55" font-family="'Courier New', monospace" font-size="11" fill="#ffe600">PK student_id (INT)</text>
    <text x="15" y="80" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   student_name (VARCHAR)</text>
    <text x="15" y="105" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   email (VARCHAR)</text>
    <text x="15" y="130" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   cgpa (FLOAT)</text>
  </g>

  <!-- Table 2: Enrollments (Junction Table) -->
  <g transform="translate(300, 200)">
    <rect width="200" height="150" fill="#0b132b" rx="6" stroke="#ffe600" stroke-width="1.5" />
    <rect width="200" height="30" fill="#ffe600" rx="5" />
    <text x="100" y="20" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="#111111" text-anchor="middle">tbl_enrollments</text>
    <text x="15" y="55" font-family="'Courier New', monospace" font-size="11" fill="#ffe600">PK enroll_id (INT)</text>
    <text x="15" y="80" font-family="'Courier New', monospace" font-size="11" fill="#6fffe9">FK student_id (INT)</text>
    <text x="15" y="105" font-family="'Courier New', monospace" font-size="11" fill="#6fffe9">FK course_id (VARCHAR)</text>
    <text x="15" y="130" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   semester (VARCHAR)</text>
  </g>

  <!-- Table 3: Courses -->
  <g transform="translate(540, 120)">
    <rect width="200" height="150" fill="#0b132b" rx="6" stroke="#48cae4" stroke-width="1.5" />
    <rect width="200" height="30" fill="#48cae4" rx="5" />
    <text x="100" y="20" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#03045e" text-anchor="middle">tbl_courses</text>
    <text x="15" y="55" font-family="'Courier New', monospace" font-size="11" fill="#ffe600">PK course_id (VARCHAR)</text>
    <text x="15" y="80" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   course_title (VARCHAR)</text>
    <text x="15" y="105" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   credits (INT)</text>
    <text x="15" y="130" font-family="'Courier New', monospace" font-size="11" fill="#caf0f8">   max_seats (INT)</text>
  </g>

  <!-- Relational Connection Arrows -->
  <g stroke="#ffe600" stroke-width="2" fill="none">
    <path d="M 260 170 L 300 240" marker-end="url(#arrow)" />
    <path d="M 540 170 L 500 240" marker-end="url(#arrow)" />
  </g>

  <!-- Query Terminal at bottom -->
  <g transform="translate(60, 400)">
    <rect width="680" height="60" fill="#050a14" rx="6" stroke="#1f3a60" stroke-width="1" />
    <text x="20" y="25" font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#6fffe9">SELECT c.title, COUNT(e.student_id) FROM tbl_courses c</text>
    <text x="20" y="46" font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#6fffe9">JOIN tbl_enrollments e ON c.course_id = e.course_id GROUP BY c.title;</text>
  </g>
</svg>
