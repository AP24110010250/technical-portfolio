<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Technical Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Connectome Brain Graph Nodes & Connections -->
  <g stroke="rgba(255, 230, 0, 0.3)" stroke-width="1.5">
    <line x1="120" y1="180" x2="220" y2="130" />
    <line x1="120" y1="180" x2="200" y2="260" />
    <line x1="220" y1="130" x2="340" y2="170" />
    <line x1="200" y1="260" x2="340" y2="170" />
    <line x1="340" y1="170" x2="460" y2="110" />
    <line x1="340" y1="170" x2="480" y2="240" />
    <line x1="340" y1="170" x2="460" y2="330" />
    <line x1="460" y1="110" x2="620" y2="140" />
    <line x1="480" y1="240" x2="640" y2="230" />
    <line x1="460" y1="330" x2="620" y2="310" />
  </g>

  <!-- Connectome Nodes -->
  <g fill="#ffe600" filter="url(#glow)">
    <circle cx="120" cy="180" r="7" />
    <circle cx="220" cy="130" r="8" />
    <circle cx="200" cy="260" r="6" />
    <circle cx="340" cy="170" r="12" fill="#ffffff" stroke="#ffe600" stroke-width="3" />
    <circle cx="460" cy="110" r="8" />
    <circle cx="480" cy="240" r="9" />
    <circle cx="460" cy="330" r="8" />
    <circle cx="620" cy="140" r="7" />
    <circle cx="640" cy="230" r="7" />
    <circle cx="620" cy="310" r="7" />
  </g>

  <!-- Badges & Mathematical Objective Card -->
  <g transform="translate(180, 370)">
    <rect x="0" y="0" width="440" height="90" rx="8" fill="rgba(0,0,0,0.65)" stroke="#ffe600" stroke-width="1.5" />
    <text x="220" y="32" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#ffe600" text-anchor="middle" letter-spacing="1">HOMOSCEDASTIC MULTI-TASK LOSS</text>
    <text x="220" y="65" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle">L = (1/2σ₁²)L₁ + (1/2σ₂²)L₂ + log(σ₁σ₂)</text>
  </g>

  <!-- Top Headers -->
  <rect x="40" y="40" width="180" height="30" rx="4" fill="#ffe600" />
  <text x="130" y="60" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="#111111" text-anchor="middle" letter-spacing="1">VIGIL LAB · IIT HYD</text>

  <rect x="580" y="40" width="180" height="30" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="670" y="60" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#e6edf3" text-anchor="middle">PyTorch · fMRI BECA</text>
</svg>
